<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weave Market - Market Details</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.ethers.io/lib/ethers-5.7.2.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">🧵 Weave Market</div>
            <nav>
                <a href="index.html">Markets</a>
                <a href="profile.html">Profile</a>
            </nav>
            <div class="header-right">
                <div id="reputationBadge" class="reputation-badge" style="display:none;">
                    ⭐ <span id="headerReputation">1000</span>
                </div>
                <button id="connectBtn" class="btn-primary">Connect Wallet</button>
            </div>
        </header>

        <div id="walletAlert" class="alert alert-info">
            Please connect your wallet to Base Sepolia network.
        </div>

        <div id="appContent" style="display:none;">
            <div class="market-detail">
                <a href="index.html" class="back-link">← Back to Markets</a>
                
                <div class="card">
                    <h1 id="marketQuestion">Loading...</h1>
                    <div id="marketInfo">
                        <p>Loading market information...</p>
                    </div>
                    
                    <div class="bet-section">
                        <h3>Place Your Bet</h3>
                        <input type="number" id="betAmount" placeholder="Amount (ETH)" step="0.001" min="0.001">
                        <div class="bet-buttons">
                            <button class="btn-success" onclick="placeBet(true)">Bet YES</button>
                            <button class="btn-danger" onclick="placeBet(false)">Bet NO</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
