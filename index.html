<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weave Market</title>
    <script src="https://cdn.ethers.io/lib/ethers-5.7.2.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header {
            background: white;
            padding: 20px 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }
        .logo {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .alert { padding: 15px; border-radius: 8px; margin-bottom: 20px; background: #dbeafe; color: #1e40af; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">🧵 Weave Market</div>
            <button onclick="connectWallet()">Connect Wallet</button>
        </header>
        
        <div id="walletAlert" class="alert">
            Please connect your wallet to Base Sepolia network.
        </div>
        
        <div id="appContent" style="display:none;">
            <div class="card">
                <h2>Markets Coming Soon</h2>
                <p>Connected: <span id="userAddress"></span></p>
                <p>Reputation: <span id="userReputation">Loading...</span></p>
            </div>
        </div>
    </div>

    <script>
        const CONTRACTS = {
            MarketFactory: "0x51a9c60cE0aAf5a65DeCEae78723d75715bdcd7b",
            ReputationSystem: "0xBb457F9Fe0F817b6E86533Aa10A57CD668404Eb0"
        };
        
        const REPUTATION_ABI = [
            "function getReputation(address user) view returns (uint256)"
        ];

        let provider, signer, userAddress;

        async function connectWallet() {
            try {
                if (typeof window.ethereum === 'undefined') {
                    alert('Please install MetaMask!');
                    return;
                }

                provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                
                const network = await provider.getNetwork();
                if (network.chainId !== 84532) {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: '0x14a34' }],
                    });
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                }
                
                signer = provider.getSigner();
                userAddress = await signer.getAddress();
                
                document.getElementById('walletAlert').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';
                document.getElementById('userAddress').textContent = userAddress.slice(0,6) + '...' + userAddress.slice(-4);
                
                const reputationContract = new ethers.Contract(
                    CONTRACTS.ReputationSystem,
                    REPUTATION_ABI,
                    provider
                );
                
                const reputation = await reputationContract.getReputation(userAddress);
                document.getElementById('userReputation').textContent = reputation.toString();
                
                alert('Connected successfully!');
                
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to connect: ' + error.message);
            }
        }
    </script>
</body>
</html>
